        not_admin: "Only my creator can run backups."
        success: |
          Backup upload completed successfully!
          Uploaded: %{uploaded}/%{found},
          Failed: %{failed}
        no_backups: "No backup files found."
        error: "Failed to upload backup: %{error}"

    group_management:
      group_selected: "Selected group: <b>%{title}</b>.\nWhat do you want to do?"
      feature_updated: "\"%{feature}\" updated successfully!"
      has_greeting_message: "%{title} has the following greeting message:"

    back_to_main: "Back to main menu"

    buttons:
      back: "⬅️ Back"

    create_announcement:
      enter_text: "Please enter the <b>text</b> of the announcement for %{group_name}."
      confirm_announcement: "Here is the announcement i'll send:"
      failed_to_send_announcement: "Failed to send announcement. Please try again later."
      announcement_sent: "Announcement sent successfully!"
      buttons:
        dont_add_payment: "Don't add payment"
        dont_add_early_bird: "Don't add early bird payment"
        dont_add_expiration: "Don't add expiration date"
        dont_add_participants_limit: "Don't add participants limit"
