        add_payment_dialogue: |
          Would you like to add a payment button to this announcement?
          If yes - please reply with the Stripe product ID you'd like to attach.
        main_payment_added: "Product \"%{product}\" added successfully!"
        main_payment_failed: "Failed to add product: %{error}. Please re-check the Stripe product ID and try again."
        add_early_bird_dialogue: |
          Would you like to add an early bird product as well?
          If yes - please reply with the Stripe product ID you'd like to attach.'
        early_bird_added: "Early bird product \"%{product}\" added successfully!"
        early_bird_failed: "Failed to add early bird product: %{error}. Please re-check the Stripe product ID and try again."
        expiration_date_dialogue: |
          Do you want to add an expiration date?
          Please enter expiration date in format "<b>YYYY/MM/DD</b>"
        expiration_date_added: "Expiration date added successfully!"
        participants_limit_dialogue: |
          Do you want to add a participants limit?
          Please enter the maximum number.
        participants_limit_added: "Your event is now limited to %{limit} participants."
        button_name_dialogue: |
          Let's choose a name for the button on the announcement.
          Please reply with the button name.
        title_too_long: "Title is too long. Please try again with a shorter one."
        button_name_added: "Button name will be: <b>\"%{name}\"</b>."
