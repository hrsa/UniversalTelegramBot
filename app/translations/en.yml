en:
  admin_interactions:
    errors:
      command_available_in_private_chats: "This command is available only in private chats."
      no_admin_groups: "You are not an admin of any group that includes me."

    hello: |
      Hello %{name}!
      Please select a group from the list below.

    backups:
      restore:
        error: "Failed to download backup: %{error}"
        success: "Backup downloaded successfully!"
        not_admin: "Only my creator can restore backups."
      run:
        not_admin: "Only my creator can run backups."
        success: |
          Backup upload completed successfully!
          Uploaded: %{uploaded}/%{found},
          Failed: %{failed}
        no_backups: "No backup files found."
        error: "Failed to upload backup: %{error}"

    group_management:
      group_selected: "Selected group: <b>%{title}</b>.\nWhat do you want to do?"
      feature_updated: "\"%{feature}\" updated successfully!"
      has_greeting_message: "%{title} has the following greeting message:"

    greeting_watch:
      new_greeting_message_dialogue: | 
        Please enter a new greeting message. Don't forget to include a hashtag like <b>#bio</b> or <b>#greeting</b>.
        Add <b>%USERNAME%</b> if you want to include the username in the message.
      new_reminder_message_dialogue: | 
        Please enter a new reminder message for the users who didn't send their greetings.
        Add <b>%USERNAME%</b> if you want to include the username in the message.

    back_to_main: "Back to main menu"

    buttons:
      back: "⬅️ Back"

    create_announcement:
      enter_text: "Please enter the <b>text</b> of the announcement for %{group_name}."
      confirm_announcement: "Here is the announcement i'll send:"
      failed_to_send_announcement: "Failed to send announcement. Please try again later."
      announcement_sent: "Announcement sent successfully!"
      buttons:
        dont_add_payment: "Don't add payment"
        dont_add_early_bird: "Don't add early bird payment"
        dont_add_expiration: "Don't add expiration date"
        dont_add_participants_limit: "Don't add participants limit"
      payment:
        add_payment_dialogue: |
          Would you like to add a payment button to this announcement?
          If yes - please reply with the Stripe product ID you'd like to attach.
        main_payment_added: "Product \"%{product}\" added successfully!"
        main_payment_failed: "Failed to add product: %{error}. Please re-check the Stripe product ID and try again."
        add_early_bird_dialogue: |
          Would you like to add an early bird product as well?
          If yes - please reply with the Stripe product ID you'd like to attach.'
        early_bird_added: "Early bird product \"%{product}\" added successfully!"
        early_bird_failed: "Failed to add early bird product: %{error}. Please re-check the Stripe product ID and try again."
        expiration_date_dialogue: |
          Do you want to add an expiration date?
          Please enter expiration date in format "<b>YYYY/MM/DD</b>"
        expiration_date_added: "Expiration date added successfully!"
        participants_limit_dialogue: |
          Do you want to add a participants limit?
          Please enter the maximum number.
        participants_limit_added: "Your event is now limited to %{limit} participants."
        button_name_dialogue: |
          Let's choose a name for the button on the announcement.
          Please reply with the button name.
        title_too_long: "Title is too long. Please try again with a shorter one."
        button_name_added: "Button name will be: <b>\"%{name}\"</b>."
        event_name_dialogue: "What's the name of your event?"
        reward_dialogue: "What type of reward would you like to add?"
        reward_type_set: "Reward type set to: <b>%{type}</b>."
        invite_disclaimer: |
          You've chosen to reward participants with an invitation to a group.
          <b>If you haven't done this yet, please <u>create the group NOW and promote me to administrator</u>!</b>
        thank_you_message_dialogue: | 
          Please enter the "Thank you" message you'd like to send to the participants.
          Add <b>%USERNAME%</b> if you want to include their username in the message.
        thank_you_message_set: |
          Thank you message set to:
          "<b>%{thank_you_message}</b>"
        invitation_group_dialogue: "Please choose the group where you'd like to invite the participants."
        invitation_reward_created: "A reward to join group \"<b>%{group_title}</b>\" has been created successfully!"
      pin:
        pin_dialogue: "Would you like to pin this announcement?"
        pinned: "Announcement pinned successfully!"

    manage_announcement:
      announcement_deleted: "Announcement deleted successfully!"
      expires_on: "Announcement expires on: <b>%{expires_on}</b>"
      enter_new_expiration_date: "Please enter a new expiration date in format <b>YYYY/MM/DD</b>."
      expiration_date_modified: "Expiration date modified successfully!"
      announcement_pinned: "Announcement pinned successfully!"
      announcement_unpinned: "Announcement unpinned successfully!"
      modify_participants_limit_dialogue: | 
        Current maximum number of participants: <b>%{current_limit}</b>.
        Please enter a new maximum number of participants.
      modify_button_name_dialogue: | 
        Please write the new button name for your announcement.
        Don't use more than 64 characters.
      modify_event_name_dialogue: | 
        Button name will be set to: <b>%{button_name}</b>.
        Please write the event name for your announcement.
        You can reply with <b>\"skip\"</b> to skip this step and set it to %{button_name} too.
      button_and_event_modified: "Button \"<b>%{button_name}</b>\" is updated to manage your event \"<b>%{event_name}</b>\"."
      invitation_group_modified: "Now the participants will get an invitation to join group \"<b>%{group_title}</b>\"."
      remove_payment:
        main: |
          Are you sure you want to remove the payment?
          That will delete:
          - Button from the announcement
          - Main payment - %{payment_product_id}
        early_bird: "\n- Early bird payment - %{payment_product_id}"
        expiration: "\n- Expiration date - %{expiration_date}"
        participants_limit: "\n- Participants limit - %{limit}"
        success: "Payment removed successfully!"
        error: "Failed to remove payment: %{error}"
        confirmation_button: "⛔ I understand. Remove payment ⛔"
      remove_early_bird_payment:
        main: "Are you sure you want to remove the early bird payment - %{payment_product_id}?"
        success: "Early bird payment removed successfully!"
        error: "Failed to remove early bird payment: %{error}"
        confirmation_button: "⛔ I understand. Remove early bird payment ⛔"
      reply_with_stripe_id: "Please reply with the Stripe product ID you'd like to attach."
      choose_reward_type: "Please choose the reward type."
      invitation_group_reminder: "<b>If you can't find the group, please <u>add me and promote me to administrator</u>!</b>"
      reward_message_set: "You've chose to reward participants with a \"Thank you\" message."
      thank_you_message_error: |
        Failed to update "Thank you" message: %{error}.
        Please re-check the message and try again.

  user_interactions:
    on_join:
      check_your_private_chat: "👀 I've sent you a private message! 👀"
      greeting: |
        Hi %{user_name}!
        I am the administrator of <b>%{group_title}</b>.
      event_expired: "Sorry, <b>\"%{event_name}\"</b> has already ended. You can't join it anymore."
      event_is_full: "Sorry, <b>\"%{event_name}\"</b> is full."
      no_pending_participants: |
        All the participants have paid, so there are no more places available.
        Please join us next time!
      has_pending_participants: |
        There are %{pending_participants_count} participants who haven't confirmed their participation yet.
        If they don't pay in the next 15 minutes, i'll give their place to you!
      user_already_paid: "You've already joined and paid for <b>\"%{event_name}\"</b>."
      thank_you_plus_link: |
        Than you for your interest for "<b>%{event_name}</b>"!
        Here is your payment link: %{payment_link}
      payment_link_disclaimer: "Please remember, this link is valid <b><u>only for 15 minutes</u></b>!"
      payment_link_expired: |
        Your payment link has expired and can't be used anymore.
        Please click on the announcement again if you still want to join!
      payment_available: |
        Congratulations, a place for you is available! Please click on the link to confirm your participation.
        
        %{payment_link}
