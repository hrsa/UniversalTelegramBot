        reward_dialogue: "What type of reward would you like to add?"
        reward_type_set: "Reward type set to: <b>%{type}</b>."
        invite_disclaimer: |
          You've chosen to reward participants with an invitation to a group.
          <b>If you haven't done this yet, please <u>create the group NOW and promote me to administrator</u>!</b>
        thank_you_message_dialogue: | 
          Please enter the thank you message you'd like to send to the participants.
          Add <b>%USERNAME%</b> if you want to include the username in the message.
        thank_you_message_set: |
          Thank you message set to:
          "<b>%{thank_you_message}</b>"
        invitation_group_dialogue: "Please choose the group where you'd like to invite the participants."
        invitation_reward_created: "A reward to join group \"<b>%{group_title}</b>\" has been created successfully!"
      pin:
        pin_dialogue: "Would you like to pin this announcement?"
        pinned: "Announcement pinned successfully!"